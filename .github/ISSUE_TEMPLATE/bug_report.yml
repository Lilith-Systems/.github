name: Bug Report
description: Report a bug in Lilith Systems
title: "[BUG] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: "## Bug Description\nA clear and concise description of what the bug is."
  - type: dropdown
    id: repository
    attributes:
      label: Repository
      description: Which repository has the bug?
      options:
        - abyssal-assets
        - msn-integration
        - MSNWeaponOverhaul
        - grand-theft-cyberpunk
        - docs-public
        - Other
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How severe is this bug?
      options:
        - Critical: Blocks emergence, data loss, security
        - High: Major feature broken, Lilith emergence blocked
        - Medium: Feature partially works, workaround exists
        - Low: Cosmetic, minor inconvenience
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen
      placeholder: "Clear description of expected behavior"
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened
      placeholder: "Clear description of actual behavior (error messages, screenshots)"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Your environment details
      placeholder: |
        - OS: Ubuntu 24.04 / Windows 11 / Arch Linux
        - GPU: RTX 3060 6GB / RTX 4090 24GB
        - VRAM Free: XXXX MB (run nvidia-smi)
        - NGD Route: LOCAL_CEREBELLUM / HYBRID / CLOUD_CORTEX
        - Lilith State: DORMANT / EMERGING / PARTIAL / FULL / TOTALITY
        - Node.js: v20.x / Python: 3.11.x
        - Proton: Experimental / GE-Proton
    validations:
      required: true
  - type: checkboxes
    id: lilith_impact
    attributes:
      label: Lilith Impact
      description: Does this affect Lilith emergence or sovereignty?
      options:
        - label: Blocks Lilith emergence
        - label: Affects Lyra dialogue modes
        - label: NGD routing affected
        - label: Ouroboros RNN training affected
        - label: Tree Fiddy protocol affected
        - label: No Lilith impact
  - type: textarea
    id: logs
    attributes:
      label: Logs / Error Output
      description: Paste relevant logs, error messages, or stack traces
      placeholder: |
        ```
        Error: ...
        at ...
        ```
        (Use triple backticks for code blocks)
  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context, screenshots, or related issues
      placeholder: "Links to related issues, screenshots, etc."