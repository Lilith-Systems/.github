<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 60" width="320" height="60">
  <defs>
    <linearGradient id="yellowGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b45309;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="nvidiaGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#76b900;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4d7c00;stop-opacity:1" />
    </linearGradient>
    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur">
        <animate attributeName="stdDeviation" values="1;3;1" dur="2s" repeatCount="indefinite" />
      </feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="eyeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur">
        <animate attributeName="stdDeviation" values="1;4;1" dur="2s" repeatCount="indefinite" />
      </feGaussianBlur>
      <feFlood flood-color="#fbbf24" flood-opacity="1" result="glow" />
      <feComposite in="glow" in2="blur" operator="in" result="eyeGlow" />
      <feMerge>
        <feMergeNode in="eyeGlow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="320" height="60" rx="8" fill="#0f172a" />
  <rect width="320" height="60" rx="8" fill="url(#yellowGradient)" opacity="0.08" />

  <!-- Left Label -->
  <rect x="0" y="0" width="130" height="60" rx="8" fill="url(#yellowGradient)" filter="url(#badgeGlow)" />
  <text x="65" y="37" text-anchor="middle" font-family="'JetBrains Mono', monospace"
        font-size="11" font-weight="700" fill="#1e1b4b">DRIVER MAN</text>

  <!-- Right Status Panel -->
  <rect x="130" y="2" width="188" height="56" rx="6" fill="#1e1b4b" />

  <!-- Status text -->
  <g font-family="'JetBrains Mono', monospace" font-size="9">
    <text x="140" y="18" font-size="9" font-weight="600" fill="#fbbf24">NVIDIA GPU</text>
    <text x="220" y="18" font-size="9" fill="#76b900">OPTIMIZATION</text>
    <text x="140" y="34" font-size="9" fill="#a855f7">TELEEMETRY</text>
    <text x="215" y="34" font-size="9" fill="#06b6d4">EDGE ROUTE</text>
    <text x="140" y="50" font-size="9" fill="#94a3b8">CO-OP DELIVERY</text>
    <text x="230" y="50" font-size="9" fill="url(#nvidiaGradient)">ZERO EXT</text>
  </g>

  <!-- Pulsing eye -->
  <circle cx="290" cy="30" r="4" fill="#fbbf24" filter="url(#eyeGlow)">
    <animate attributeName="r" values="3;5;3" dur="1.5s" repeatCount="indefinite" />
  </circle>
</svg>
