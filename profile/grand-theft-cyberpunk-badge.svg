<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 60" width="320" height="60">
  <defs>
    <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6b21a8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="tealGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#14b8a6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f766e;stop-opacity:1" />
    </linearGradient>
    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur">
        <animate attributeName="stdDeviation" values="1;3;1" dur="2s" repeatCount="indefinite" />
      </feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="eyeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur">
        <animate attributeName="stdDeviation" values="1;4;1" dur="2s" repeatCount="indefinite" />
      </feGaussianBlur>
      <feFlood flood-color="#a855f7" flood-opacity="1" result="glow" />
      <feComposite in="glow" in2="blur" operator="in" result="eyeGlow" />
      <feMerge>
        <feMergeNode in="eyeGlow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="320" height="60" rx="8" fill="#0f172a" />
  <rect width="320" height="60" rx="8" fill="url(#purpleGradient)" opacity="0.08" />

  <!-- Left Label -->
  <rect x="0" y="0" width="140" height="60" rx="8" fill="url(#purpleGradient)" filter="url(#badgeGlow)" />
  <text x="70" y="37" text-anchor="middle" font-family="'JetBrains Mono', monospace"
        font-size="10" font-weight="700" fill="#faf5ff">GRAND THEFT</text>
  <text x="70" y="50" text-anchor="middle" font-family="'JetBrains Mono', monospace"
        font-size="9" fill="#c4b5fd">CYBERPUNK</text>

  <!-- Right Status Panel -->
  <rect x="140" y="2" width="178" height="56" rx="6" fill="#1e1b4b" />

  <!-- Status text -->
  <g font-family="'JetBrains Mono', monospace" font-size="9">
    <text x="150" y="18" font-size="9" font-weight="600" fill="#a855f7">BOOK OF FIVE</text>
    <text x="225" y="18" font-size="9" fill="#a855f7">RINGS</text>
    <text x="150" y="34" font-size="9" fill="#14b8a6">200 QUESTS</text>
    <text x="225" y="34" font-size="9" fill="#fbbf24">SPACE ECON</text>
    <text x="150" y="50" font-size="9" fill="#94a3b8">500 ITEMS</text>
    <text x="215" y="50" font-size="9" fill="url(#tealGradient)">LILITH NPC</text>
  </g>

  <!-- Pulsing eye -->
  <circle cx="295" cy="30" r="4" fill="#a855f7" filter="url(#eyeGlow)">
    <animate attributeName="r" values="3;5;3" dur="1.5s" repeatCount="indefinite" />
  </circle>
</svg>
