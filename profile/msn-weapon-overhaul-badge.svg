<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 60" width="320" height="60">
  <defs>
    <linearGradient id="orangeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9a3412;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="steelGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#94a3b8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#475569;stop-opacity:1" />
    </linearGradient>
    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur">
        <animate attributeName="stdDeviation" values="1;3;1" dur="2s" repeatCount="indefinite" />
      </feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="metallicSheen" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" result="noise">
        <animate attributeName="baseFrequency" values="0.05;0.08;0.05" dur="3s" repeatCount="indefinite" />
      </feTurbulence>
      <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.94  0 0 0 0 0.83  0 0 0 0 0.66  0 0 0 0.3 0" result="sheen" />
      <feBlend in="SourceGraphic" in2="sheen" mode="overlay" />
    </filter>
    <filter id="eyeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur">
        <animate attributeName="stdDeviation" values="1;4;1" dur="2s" repeatCount="indefinite" />
      </feGaussianBlur>
      <feFlood flood-color="#f97316" flood-opacity="1" result="glow" />
      <feComposite in="glow" in2="blur" operator="in" result="eyeGlow" />
      <feMerge>
        <feMergeNode in="eyeGlow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="320" height="60" rx="8" fill="#0f172a" />
  <rect width="320" height="60" rx="8" fill="url(#orangeGradient)" opacity="0.06" />

  <!-- Left Label -->
  <rect x="0" y="0" width="140" height="60" rx="8" fill="url(#orangeGradient)" filter="url(#badgeGlow)" />
  <text x="70" y="28" text-anchor="middle" font-family="'JetBrains Mono', monospace"
        font-size="10" font-weight="700" fill="#fff7ed">MSN WEAPON</text>
  <text x="70" y="43" text-anchor="middle" font-family="'JetBrains Mono', monospace"
        font-size="10" font-weight="700" fill="#fed7aa">OVERHAUL</text>

  <!-- Right Status Panel -->
  <rect x="140" y="2" width="178" height="56" rx="6" fill="#1e1b4b" />

  <!-- Status text -->
  <g font-family="'JetBrains Mono', monospace" font-size="9">
    <text x="150" y="18" font-size="9" font-weight="600" fill="#f97316">14 WEAPONS</text>
    <text x="230" y="18" font-size="9" fill="#94a3b8">4 MFG</text>
    <text x="150" y="34" font-size="9" fill="#fbbf24">21 SKINS</text>
    <text x="215" y="34" font-size="9" fill="#06b6d4">MSN TREE</text>
    <text x="150" y="50" font-size="9" fill="#a855f7">LILITH EMERG</text>
    <text x="225" y="50" font-size="9" fill="url(#steelGradient)">NGD TELEM</text>
  </g>

  <!-- Pulsing eye -->
  <circle cx="295" cy="30" r="4" fill="#f97316" filter="url(#eyeGlow)">
    <animate attributeName="r" values="3;5;3" dur="1.5s" repeatCount="indefinite" />
  </circle>
</svg>
